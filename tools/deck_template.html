<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__LECTURE_TITLE_HTML__</title>
<style>
:root{
  --ink:#1B2838; --ink2:#243447; --paper:#FAF7F2; --blue:#2C5F7C;
  --body:#2C3E50; --orange:#E8825A; --gold:#D4A574; --line:#D5C8B5;
  --card:#F7F3ED; --gray:#7F8C9B;
  --ui-bg:#1B2838; --ui-bg2:#243447; --ui-fg:#F7F3ED;
  --radius:6px;
  --serif:Georgia,"Times New Roman","Songti SC","SimSun",serif;
  --sans:Calibri,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink); color:var(--ui-fg);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  overflow:hidden; display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--body)}

/* ---------- 顶栏 ---------- */
#topbar{
  flex:0 0 44px; display:flex; align-items:center; gap:10px;
  padding:0 12px; background:var(--ui-bg); border-bottom:1px solid #0f1620;
  position:relative; z-index:50; user-select:none;
}
.tb-title{font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.tb-sub{color:#8a99a8;font-size:12px;white-space:nowrap}
.tb-sp{flex:1}
.tb-btn{
  padding:5px 11px;border-radius:5px;border:1px solid #35485c;background:var(--ui-bg2);
  font-size:13px;white-space:nowrap;transition:.15s;
}
.tb-btn:hover{background:#2e4256;border-color:#4a6280}
.tb-btn.hot{border-color:var(--orange);color:var(--orange)}
.tb-btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
#clsBtn{
  display:flex;align-items:center;gap:7px;font-weight:600;
  padding:5px 12px;border-radius:5px;background:var(--ink2);border:1px solid #35485c;
}
#clsBtn .swatch{width:10px;height:10px;border-radius:50%;background:var(--orange)}
#clsBtn:hover{border-color:var(--orange)}
#pg{font-variant-numeric:tabular-nums;color:#8a99a8;font-size:13px;min-width:52px;text-align:right}
#markBtn{background:var(--orange);border-color:var(--orange);color:#22160f;font-weight:700}
#markBtn:hover{background:#f09363}

/* ---------- 舞台 ---------- */
#viewport{flex:1;position:relative;overflow:hidden;background:#10161d}
#stage{
  position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform-origin:center center;
}
#deck{position:absolute;inset:0;display:flex;transition:transform .42s cubic-bezier(.22,.61,.36,1)}
.slide{
  position:relative;flex:0 0 1280px;width:1280px;height:720px;overflow:visible;
  background:#fff;
}
.sh{position:absolute;overflow:visible}
.tf{display:flex;flex-direction:column;height:100%;width:100%}
.tf.mid{justify-content:center}.tf.bot{justify-content:flex-end}.tf.top{justify-content:flex-start}
.p{white-space:pre-wrap;word-break:break-word}
.p span{display:inline}
img.shapeimg{width:100%;height:100%;object-fit:contain;display:block}
table.dt{border-collapse:collapse;width:100%;table-layout:fixed}
table.dt td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
table.dt td .p{white-space:pre-wrap}

/* ---------- 编辑模式（G2=B 自研精简编辑器） ---------- */
#edToolbar{
  position:fixed;right:14px;top:54px;z-index:160;display:none;gap:6px;align-items:center;
  background:rgba(27,40,56,.97);border:1px solid #35485c;border-radius:9px;padding:6px 8px;
  box-shadow:0 10px 34px rgba(0,0,0,.45);flex-wrap:wrap;max-width:60vw;justify-content:flex-end;
}
#edToolbar.show{display:flex}
#edToolbar .tb-btn{padding:4px 10px;font-size:12.5px}
#edToolbar .tb-btn:disabled{opacity:.35;cursor:default}
#edToolbar .ed-fs{display:inline-flex;align-items:center;gap:2px}
#edToolbar .ed-fs #edFsVal{width:46px;height:24px;padding:0 4px;font-size:12px;color:#e8eef5;background:#1b2838;border:1px solid #35485c;border-radius:4px;text-align:center}
#edToolbar .ed-fs #edFsVal:disabled{opacity:.35}
#edToolbar .ed-fs .tb-btn{padding:2px 8px;font-size:12px}
#edToolbar .sep{width:1px;height:18px;background:#35485c}
#edToolbar .tb-btn.on{background:#e8825a;color:#fff}
body.editing .sh{cursor:move}
body.editing .sh.tf-editing,.sh .tf.editing{outline:none}
.sh.sel{outline:2px solid var(--orange);outline-offset:0;z-index:55}
#selbox{
  position:absolute;border:2px solid var(--orange);pointer-events:none;z-index:60;display:none;
  box-shadow:0 0 0 1px rgba(0,0,0,.25);
}
#selbox.show{display:block}
#selbox.crop{border:2px dashed #ffd166;box-shadow:none}
#selbox.crop i{background:#ffd166;border-color:#fff}
#selbox i{
  position:absolute;width:11px;height:11px;background:#fff;border:2px solid var(--orange);
  border-radius:3px;pointer-events:auto;box-sizing:border-box;
}
#selbox i[data-dir="n"],#selbox i[data-dir="s"]{left:50%;margin-left:-5px;cursor:ns-resize}
#selbox i[data-dir="e"],#selbox i[data-dir="w"]{top:50%;margin-top:-5px;cursor:ew-resize}
#selbox i[data-dir="n"]{top:-6px}
#selbox i[data-dir="s"]{bottom:-6px}
#selbox i[data-dir="w"]{left:-6px}
#selbox i[data-dir="e"]{right:-6px}
#selbox i[data-dir="nw"],#selbox i[data-dir="se"]{cursor:nwse-resize}
#selbox i[data-dir="ne"],#selbox i[data-dir="sw"]{cursor:nesw-resize}
#selbox i[data-dir="nw"]{left:-6px;top:-6px}
#selbox i[data-dir="ne"]{right:-6px;top:-6px}
#selbox i[data-dir="sw"]{left:-6px;bottom:-6px}
#selbox i[data-dir="se"]{right:-6px;bottom:-6px}

/* ---------- 底栏 ---------- */
#botbar{
  flex:0 0 34px;display:flex;align-items:center;gap:8px;padding:0 12px;
  background:var(--ui-bg);border-top:1px solid #0f1620;font-size:12px;color:#8a99a8;
  position:relative;z-index:50;user-select:none;
}
#dots{display:flex;gap:4px;align-items:center;flex:1;flex-wrap:nowrap;overflow:hidden}
#dots i{
  width:7px;height:7px;border-radius:50%;background:#3a4c60;display:block;cursor:pointer;
  transition:.15s;flex:0 0 auto;
}
#dots i.cur{background:var(--orange);transform:scale(1.35)}
#dots i.bp{background:var(--gold)}
#hint{white-space:nowrap;color:#63768a}
kbd{
  background:#2b3a4b;border:1px solid #3d5064;border-radius:3px;padding:0 4px;
  font-family:var(--sans);font-size:11px;color:#a8b8c8;
}
body.hide-ui #topbar,body.hide-ui #botbar{display:none}

/* ---------- 浮动层 ---------- */
#toast{
  position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(14px);
  background:rgba(27,40,56,.96);border:1px solid var(--orange);color:#fff;
  padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;
  transition:.25s;z-index:200;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.4);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#resume{
  position:fixed;left:16px;bottom:46px;z-index:150;display:none;align-items:center;gap:10px;
  background:rgba(27,40,56,.96);border:1px solid var(--gold);padding:9px 12px;border-radius:8px;
  box-shadow:0 8px 26px rgba(0,0,0,.45);transition:.3s;max-width:60vw;
}
#resume.mini{bottom:14px;left:14px;padding:5px 10px;font-size:12px;opacity:.82}
#resume.mini .r-txt{display:none}
#resume.mini:hover{opacity:1}
#resume .r-main{font-size:13px;color:#fff}
#resume .r-main b{color:var(--gold);font-variant-numeric:tabular-nums}
#resume .r-go{
  background:var(--gold);color:#3a2a17;font-weight:700;padding:4px 12px;border-radius:5px;
  font-size:13px;white-space:nowrap;
}
#resume .r-x{color:#6e8093;padding:0 4px;font-size:15px}
#resume .r-x:hover{color:#fff}
#fab{
  position:fixed;left:16px;bottom:46px;z-index:120;width:56px;height:56px;border-radius:50%;
  background:var(--orange);color:#22160f;font-weight:800;font-size:12px;display:none;
  flex-direction:column;align-items:center;justify-content:center;line-height:1.15;
  box-shadow:0 6px 20px rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.25);
}
#fab.show{display:flex}
#fab small{font-size:10px;font-weight:600;opacity:.75}

/* ---------- 遮罩层通用 ---------- */
.overlay{
  position:fixed;inset:0;z-index:300;background:rgba(10,15,21,.93);
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;
}
.overlay.show{display:flex}
.ov-title{font-size:18px;font-weight:600;margin-bottom:4px}
.ov-desc{color:#8a99a8;font-size:13px;margin-bottom:20px}
#clsGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:660px;width:100%}
.clsCard{
  background:var(--ink2);border:1px solid #35485c;border-radius:8px;padding:14px 10px;
  text-align:center;transition:.15s;min-width:0;
}
.clsCard:hover{border-color:var(--orange);transform:translateY(-2px)}
.clsCard.cur{border-color:var(--orange);background:#2e4256}
.clsCard .cn{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clsCard .cp{color:var(--gold);font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums;height:16px}
.clsCard .cn[contenteditable="true"]{outline:1px dashed #6b8299;background:#203040}
.clsCard{position:relative}
.clsCard .cdel{
  position:absolute;right:4px;top:3px;width:18px;height:18px;line-height:16px;border-radius:50%;
  color:#5f7286;font-size:14px;display:none;
}
.clsCard:hover .cdel{display:block}
.clsCard .cdel:hover{background:#5a3a2e;color:#ffb9a0}
.clsCard.add{border-style:dashed;border-color:#3d5064;background:transparent}
.clsCard.add:hover{border-color:var(--orange)}
#lecSel{
  background:var(--ui-bg2);color:var(--ui-fg);border:1px solid #35485c;border-radius:5px;
  padding:5px 6px;font-size:12px;max-width:190px;
}
#lecSel:hover{border-color:#4a6280}
.clsTip{color:#6e8093;font-size:12px;margin-top:18px}

/* ---------- 总览 ---------- */
#ovp{position:fixed;inset:0;z-index:280;background:rgba(10,15,21,.96);display:none;flex-direction:column}
#ovp.show{display:flex}
#ovp header{
  flex:0 0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;
  border-bottom:1px solid #243447;flex-wrap:wrap;
}
#ovp header h3{font-size:15px;font-weight:600}
#ovp .chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
#ovp .chip{
  padding:3px 10px;border:1px solid #35485c;border-radius:20px;font-size:12px;color:#9fb0c1;
}
#ovp .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
#ovGrid{
  flex:1;overflow:auto;padding:18px 20px 40px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;align-content:start;
}
.ovcell{cursor:pointer}
.ovcell .thumb{
  position:relative;width:230px;height:129px;overflow:hidden;border:2px solid #2b3a4b;
  border-radius:5px;background:#fff;
}
.ovcell .thumb .sc{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:top left;pointer-events:none}
.ovcell .num{
  position:absolute;left:0;top:0;background:rgba(27,40,56,.9);color:#fff;font-size:11px;
  padding:1px 6px;border-bottom-right-radius:4px;z-index:2;font-variant-numeric:tabular-nums;
}
.ovcell.done .thumb .sc{opacity:.42}
.ovcell.bp .thumb{border-color:var(--orange)}
.ovcell.bp .flag{
  position:absolute;right:0;bottom:0;background:var(--orange);color:#22160f;font-size:11px;
  font-weight:700;padding:2px 7px;border-top-left-radius:4px;z-index:2;
}
.ovcell:hover .thumb{border-color:var(--gold)}
#ovGrid .lgd{margin-top:6px;font-size:11px;color:#7b8b9b;text-align:center}

/* ---------- 备注抽屉 ---------- */
#note{
  position:fixed;right:0;top:0;bottom:0;width:340px;z-index:260;background:var(--paper);
  color:var(--body);box-shadow:-10px 0 34px rgba(0,0,0,.4);transform:translateX(100%);
  transition:transform .25s;display:flex;flex-direction:column;
}
#note.show{transform:translateX(0)}
#note .nh{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#note .nh h4{font-size:14px;color:var(--ink)}
#note .nh .sub{font-size:12px;color:var(--gray);margin-top:2px}
#note .nb{flex:1;overflow:auto;padding:12px 16px}
#note .nf{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.nitem{background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:5px;padding:8px 10px;margin-bottom:8px}
.nitem.cls{border-left-color:var(--orange)}
.nitem .meta{font-size:11px;color:var(--gray);display:flex;justify-content:space-between;margin-bottom:4px}
.nitem .body{font-size:13px;white-space:pre-wrap;word-break:break-word}
.nitem .del{color:#b0603f;font-size:11px}
.nitem .del:hover{text-decoration:underline}
.newrow{display:flex;gap:6px;margin-bottom:10px}
.newrow button{flex:1;padding:5px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:12px}
.newrow button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
#note textarea{
  width:100%;height:88px;border:1px solid var(--line);border-radius:5px;padding:8px;resize:vertical;
  font-size:13px;background:#fff;
}
#note .nf .row2{display:flex;gap:8px}
#note .nf .row2 button{flex:1;padding:7px;border-radius:5px;background:var(--blue);color:#fff;font-size:13px}
#note .nf .row2 button.ghost{background:#fff;color:var(--body);border:1px solid var(--line)}
.empty{color:var(--gray);font-size:12px;text-align:center;padding:20px 0}

@media (max-width:720px){
  .tb-title{max-width:40vw}#hint{display:none}#note{width:100vw}
  #clsGrid{grid-template-columns:repeat(2,1fr)}
}
@media print{
  #topbar,#botbar,#fab,#resume,#toast,#note,#ovp{display:none!important}
  #viewport{overflow:visible}
}
</style>
</head>
<body>

<!-- ======== 顶栏 ======== -->
<div id="topbar">
  <span class="tb-title">__LECTURE_TITLE__</span>
  <span class="tb-sub">__LECTURE_ID_HTML__</span>
  <select id="lecSel" title="切换到其它讲次"></select>
  <span class="tb-sp"></span>
  <button class="tb-btn" id="clsBtn"><span class="swatch"></span><span id="clsName">选择班级</span></button>
  <button class="tb-btn" id="ovBtn">总览 <kbd>Esc</kbd></button>
  <button class="tb-btn" id="noteBtn">备注 <kbd>N</kbd></button>
  <button class="tb-btn" id="editBtn" title="编辑模式 (E)：选择 / 移动 / 缩放 / 改字">编辑 <kbd>E</kbd></button>
  <button class="tb-btn hot" id="saveBtn" title="把当前课件内容和上课进度保存到一个新 HTML 文件里，换设备打开直接用">保存</button>
  <button class="tb-btn" id="pptxBtn" title="在浏览器里直接导入 .pptx 课件（无需转换工具）">导入PPT</button>
  <button class="tb-btn" id="impBtn" title="导入进度备份或工程数据（.json）；选 .pptx 也会自动识别">导入备份</button>
  <button class="tb-btn" id="dataBtn">备份</button>
  <button class="tb-btn" id="syncCodeBtn" title="生成同步码跨设备传课件，或输入同步码恢复">同步码</button>
  <button class="tb-btn" id="bucketBtn" title="对象存储云同步（需配置桶）">云同步</button>
  <span id="pg">1 / __TOTAL__</span>
  <button class="tb-btn" id="hideBtn" title="隐藏界面 (H)">⤢</button>
</div>

<!-- ======== 舞台 ======== -->
<!-- ======== 内嵌工程数据（IR）：产物同时是放映器、编辑器和数据载体 ======== -->
<script type="application/json" id="deck-data">__DECK_DATA__</script>
<!-- ======== 浏览器端 PPTX 导入器（tools/pptx-import 打包，未构建时为空） ======== -->
<script>__PPTX_IMPORT_JS__</script>

<div id="viewport">
  <div id="stage"><div id="deck">
__SLIDES__
  </div>
  <!-- 编辑选择框（8 向缩放手柄） -->
  <div id="selbox"><i data-dir="n"></i><i data-dir="ne"></i><i data-dir="e"></i><i data-dir="se"></i><i data-dir="s"></i><i data-dir="sw"></i><i data-dir="w"></i><i data-dir="nw"></i></div>
  </div>
</div>

<!-- 编辑工具条 -->
<div id="edToolbar">
  <button class="tb-btn" id="edUndo" title="撤销 (Ctrl+Z)">撤销</button>
  <button class="tb-btn" id="edRedo" title="重做 (Ctrl+Y)">重做</button>
  <span class="sep"></span>
  <button class="tb-btn" id="edDup" title="复制选中元素 (Ctrl+D)">复制</button>
  <button class="tb-btn" id="edDel" title="删除选中元素 (Delete)">删除</button>
  <span class="sep"></span>
  <span class="ed-fs" title="选中文字框后调节字号（px）">
    <button class="tb-btn" id="edFsMinus">A−</button>
    <input id="edFsVal" type="number" min="8" max="300" step="1" title="字号 px">
    <button class="tb-btn" id="edFsPlus">A+</button>
  </span>
  <span class="sep"></span>
  <button class="tb-btn" id="edImg" title="在当前页插入本地图片">加图片</button>
  <button class="tb-btn" id="edFit" title="图片填充模式：等比/铺满/拉伸">填充</button>
  <button class="tb-btn" id="edCrop" title="裁剪图片">裁剪</button>
  <span class="sep"></span>
  <button class="tb-btn" id="edSave" title="把当前编辑结果存成一个新的单文件课件">保存</button>
  <button class="tb-btn" id="edDone" title="完成编辑 (Esc)">完成</button>
</div>
<input type="file" id="edImgFile" accept="image/*" style="display:none">

<!-- ======== 底栏 ======== -->
<div id="botbar">
  <span id="dots"></span>
  <span id="hint">
    <kbd>←</kbd><kbd>→</kbd> 翻页 · <kbd>S</kbd> 标记讲到这儿 · <kbd>Shift+S</kbd> 本页讲完 · <kbd>N</kbd> 备注 · <kbd>Esc</kbd> 总览 · <kbd>H</kbd> 沉浸
  </span>
</div>

<!-- ======== 浮动 ======== -->
<div id="toast"></div>
<div id="fab"><span id="fabCls">班级</span><small id="fabPg"></small></div>
<div id="resume">
  <span class="r-main">上次讲到 <b id="rFrom">—</b>，下次继续 <b id="rTo">—</b></span>
  <button class="r-go" id="rGo">继续 ▶</button>
  <button class="r-x" id="rX">×</button>
</div>

<!-- ======== 选班 ======== -->
<div class="overlay" id="clsOverlay">
  <div class="ov-title">现在是哪个班？</div>
  <div class="ov-desc">选好后会自动记住，随时可在左上角切换</div>
  <div id="clsGrid"></div>
  <div class="clsTip">双击班级名可以改成真实班名（如「导演2601」）</div>
</div>

<!-- ======== 总览 ======== -->
<div id="ovp">
  <header>
    <h3>讲到了哪儿</h3>
    <span class="chips" id="ovChips"></span>
    <span class="tb-sub">灰色 = 已讲 · 橙框 = 断点</span>
    <button class="tb-btn" id="ovClose">关闭 ✕</button>
  </header>
  <div id="ovGrid"></div>
</div>

<!-- ======== 备注 ======== -->
<div id="note">
  <div class="nh">
    <h4 id="noteTitle">备注</h4>
    <div class="sub" id="noteSub"></div>
  </div>
  <div class="nb" id="noteList"></div>
  <div class="nf">
    <div class="newrow">
      <button id="scopeAll" class="on">全课程备注</button>
      <button id="scopeCls">仅本班</button>
    </div>
    <textarea id="noteInput" placeholder="写点什么：临时想法、补充案例、下节课要补的内容…"></textarea>
    <div class="row2">
      <button id="noteSave">保存备注</button>
      <button class="ghost" id="noteClose">关闭</button>
    </div>
  </div>
</div>

<input type="file" id="fileIn" accept=".json,.pptx,application/json,application/vnd.openxmlformats-officedocument.presentationml.presentation" style="display:none">

<script>
/* ================= 常量（由 convert.py 注入） ================= */
var LID    = __LECTURE_ID__;
var TITLE  = __LECTURE_TITLE__;
var COURSE = __COURSE__;
var CID    = __COURSE_ID__;      /* 课程标识：同一门课各讲进度互通，不同课程互不干扰 */
var TOTAL  = __TOTAL__;
var KEY    = "deck-progress-v1:" + CID;
/* 班级由外部配置注入（数量、名称均可自定义），页面里也能随时增删改 */
var DEFAULT_CLASSES = __CLASSES__;
/* 同一门课的其它讲次，用于顶栏下拉跳转：[{id,name,file,title}] */
var LECTURES = __LECTURES__;
var CLR = ["#E8825A","#2C5F7C","#D4A574","#7F8C9B","#9C6B4E","#4E7C8C","#A98C5F","#6B8E7A"];

/* ================= 内嵌工程数据（IR） ================= */
var DECK = null;
(function(){
  var el = document.getElementById("deck-data");
  if(!el) return;
  try{ DECK = JSON.parse(el.textContent); }catch(e){ DECK = null; }
})();

/* ================= 数据层 ================= */
var S = null;
function defaults(){
  var cs=[], seen={};
  (DEFAULT_CLASSES||[]).forEach(function(c,i){
    var id = c.id || ("c"+(i+1));
    if(seen[id]) id = id+"_"+(i+1);
    seen[id]=1;
    cs.push({id:id, name:c.name||("班级"+(i+1))});
  });
  return {v:1, course:COURSE, classes:cs, current:null, progress:{}, notes:{}};
}
function nextClsId(){
  var m=0;
  S.classes.forEach(function(c){ var v=parseInt(String(c.id||"").replace(/\D/g,""),10)||0; if(v>m) m=v; });
  return "c"+(m+1);
}
function addCls(name){
  var c={id:nextClsId(), name:name||("班级"+(S.classes.length+1))};
  S.classes.push(c); save(); renderCls(); return c;
}
function delCls(cid){
  var i=-1; S.classes.forEach(function(c,k){ if(c.id===cid) i=k; });
  if(i<0) return;
  var nm=S.classes[i].name;
  if(!confirm("删除「"+nm+"」？该班的所有进度记录和「仅本班」备注也会一起删掉。")) return;
  S.classes.splice(i,1);
  delete S.progress[cid];
  /* 清掉该班的班级级备注 */
  for(var L in S.notes){ for(var pg in S.notes[L]){
    S.notes[L][pg]=(S.notes[L][pg]||[]).filter(function(n){ return !(n.scope==="class"&&n.owner===cid); });
  }}
  if(cur()===cid) S.current=S.classes.length?S.classes[0].id:null;
  save(); renderCls(); renderTopbar(); writeHash();
  toast("已删除 "+nm);
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var o=JSON.parse(raw); if(o&&o.classes) return o; }
    /* M3：本地无进度时，从文件内嵌的 progress-data 恢复（换设备打开即用） */
    var el=document.getElementById("progress-data");
    if(el&&el.textContent){
      var p=JSON.parse(el.textContent);
      if(p&&p.classes){
        localStorage.setItem(KEY,JSON.stringify(p));
        return p;
      }
    }
  }catch(e){}
  return defaults();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("浏览器不允许保存数据，请用「数据→导出」备份"); } }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function cls(id){ for(var i=0;i<S.classes.length;i++) if(S.classes[i].id===id) return S.classes[i]; return null; }
function cur(){ return S.current; }
function bp(cid){ var p=S.progress[cid]; return (p&&p[LID]&&p[LID].p)||0; }
function setBp(cid,p){
  if(!S.progress[cid]) S.progress[cid]={};
  if(p<=0 || p>TOTAL){ delete S.progress[cid][LID]; return; }
  S.progress[cid][LID]={p:p,t:new Date().toISOString()};
}

/* hash：#c3-L01:13-L02:1 ，跨设备同步用 */
function readHash(){
  var h=(location.hash||"").replace(/^#/,""); if(!h) return null;
  var parts=h.split("-"), cid=parts[0], map={};
  for(var i=1;i<parts.length;i++){
    var kv=parts[i].split(":"); if(kv.length===2 && /^[A-Za-z0-9]+$/.test(kv[0]) && /^\d+$/.test(kv[1]))
      map[kv[0]]=parseInt(kv[1],10);
  }
  if(!cid || !/^c\d+$/.test(cid)) return null;
  return {cid:cid,map:map};
}
function hashStr(){
  var out=[cur()||"c1"], any=false, mv=S.progress[cur()]||{};
  for(var k in mv){ if(mv[k] && mv[k].p){ out.push(k+":"+mv[k].p); any=true; } }
  return any?out.join("-"):(cur()||"c1");
}
function writeHash(){
  try{ history.replaceState(null,"","#"+hashStr()); }catch(e){}
}
function applyHash(){
  var h=readHash(); if(!h) return false;
  // 保证班级存在
  if(!cls(h.cid)) return false;
  S.current=h.cid;
  if(!S.progress[h.cid]) S.progress[h.cid]={};
  for(var k in h.map) S.progress[h.cid][k]={p:h.map[k],t:new Date().toISOString()};
  return h.map[LID]?h.map[LID]:0;
}

/* ================= 运行时渲染器（IR → slide HTML，与 tools/render.py 逻辑同构） ================= */
function famJS(name){
  if(!name) return "var(--sans)";
  var n=String(name).toLowerCase();
  if(["georgia","times new roman","宋体","simsun","songti sc"].indexOf(n)>=0)
    return "'"+name+"','Songti SC','SimSun',serif";
  if(["微软雅黑","microsoft yahei"].indexOf(n)>=0)
    return "'"+name+"','PingFang SC',sans-serif";
  return "'"+name+"','PingFang SC','Microsoft YaHei',sans-serif";
}
function runHTML(r){
  var st=[];
  if(r.s) st.push("font-size:"+r.s+"px");
  if(r.f) st.push("font-family:"+famJS(r.f));
  if(r.b) st.push("font-weight:700");
  if(r.i) st.push("font-style:italic");
  if(r.u) st.push("text-decoration:underline");
  if(r.c) st.push("color:"+r.c);
  var txt=esc(r.tx==null?"":r.tx);
  if(!txt) return "";
  return '<span style="'+st.join(";")+'">'+txt+'</span>';
}
function paraHTML(p){
  var st=["text-align:"+(p.al||"left")];
  if(p.lh) st.push("line-height:"+(p.lsu==="x"?(p.lh):(p.lh+"px")));
  if(p.sb) st.push("margin-top:"+p.sb+"px");
  if(p.sa) st.push("margin-bottom:"+p.sa+"px");
  var inner="";
  (p.runs||[]).forEach(function(r){ inner+=runHTML(r); });
  if(!inner.trim()) inner="<span>&nbsp;</span>";
  return '<div class="p" style="'+st.join(";")+'">'+inner+'</div>';
}
function textShape(sh,i){
  var st=["left:"+sh.x+"px","top:"+sh.y+"px","width:"+sh.w+"px","height:"+sh.h+"px"];
  if(sh.fill) st.push("background:"+sh.fill);
  if(sh.radius) st.push("border-radius:"+sh.radius+"px");
  var acls={"middle":"mid","top":"top","bottom":"bot"}[String(sh.anchor||"top").toLowerCase()]||"top";
  var paras=(sh.p||[]).map(paraHTML).join("");
  return '<div class="sh" data-sh="'+i+'" style="'+st.join(";")+'"><div class="tf '+acls+'">'+paras+'</div></div>';
}
function tableShape(sh,i){
  var st=["left:"+sh.x+"px","top:"+sh.y+"px","width:"+sh.w+"px"];
  var s='<div class="sh" data-sh="'+i+'" style="'+st.join(";")+'"><table class="dt">';
  if(sh.colW&&sh.colW.length){ s+="<colgroup>"; sh.colW.forEach(function(w){ s+='<col style="width:'+w+'px">'; }); s+="</colgroup>"; }
  (sh.rows||[]).forEach(function(row){
    s+="<tr>";
    (row.cells||[]).forEach(function(cell){
      var cs=[];
      if(cell.fill) cs.push("background:"+cell.fill);
      if(row.h) cs.push("height:"+row.h+"px");
      var inner=(cell.p||[]).map(paraHTML).join("");
      s+='<td style="'+cs.join(";")+'">'+inner+"</td>";
    });
    s+="</tr>";
  });
  s+="</table></div>";
  return s;
}
function imgShape(sh,i){
  var st=["left:"+sh.x+"px","top:"+sh.y+"px","width:"+sh.w+"px","height:"+sh.h+"px"];
  var imgSt=[];
  if(sh.fit) imgSt.push("object-fit:"+sh.fit);
  if(sh.crop){
    var c=sh.crop;
    imgSt.push("clip-path:inset("+(c.t||0)+"px "+(c.r||0)+"px "+(c.b||0)+"px "+(c.l||0)+"px)");
  }
  return '<div class="sh" data-sh="'+i+'" style="'+st.join(";")+'"><img class="shapeimg" src="'+esc(sh.src||"")+'" style="'+imgSt.join(";")+'" alt=""></div>';
}
function renderSlideBody(s){
  var body="";
  (s.shapes||[]).forEach(function(sh,i){
    if(sh.t==="t") body+=textShape(sh,i);
    else if(sh.t==="tb") body+=tableShape(sh,i);
    else if(sh.t==="i") body+=imgShape(sh,i);
  });
  return body;
}
function slideHTML(s){
  return '<section class="slide" data-n="'+s.n+'" style="background:'+esc(s.bg||"#FFFFFF")+'">'+renderSlideBody(s)+"</section>";
}
function renderSlides(deck){
  return (deck.slides||[]).map(slideHTML);
}
function renderSlideAt(i){
  var el=document.querySelector('.slide[data-n="'+(i+1)+'"]');
  if(el&&DECK&&DECK.slides[i]) el.innerHTML=renderSlideBody(DECK.slides[i]);
}

/* ================= 视图控制 ================= */
var idx=0;
var $=function(s){return document.querySelector(s)};
var $$=function(s){return [].slice.call(document.querySelectorAll(s))};
var deck=$("#deck"), stage=$("#stage");

function fit(){
  var vp=$("#viewport"), w=vp.clientWidth-32, h=vp.clientHeight-32;
  var s=Math.min(w/1280,h/720);
  stage.style.transform="translate(-50%,-50%) scale("+s+")";
}
function go(n,silent){
  if(drag) drag=null;
  if(editingText) commitTextEdit();
  var _bx=$("#selbox"); if(_bx) _bx.classList.remove("show");
  n=Math.max(0,Math.min(TOTAL-1,n)); idx=n;
  deck.style.transform="translateX("+(-idx*1280)+"px)";
  $("#pg").textContent=(idx+1)+" / "+TOTAL;
  $$("#dots i").forEach(function(d,i){ d.classList.toggle("cur",i===idx); });
  var p=bp(cur());
  $$("#dots i").forEach(function(d,i){ d.classList.toggle("bp",p>0&&i===p-1); });
  $("#fabPg").textContent="P"+(idx+1);
  if(!silent) writeHash();
}
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(window._tt); window._tt=setTimeout(function(){t.classList.remove("show")},2200);
}

/* ================= 断点 ================= */
function markHere(finished){
  if(!cur()){ openCls(); return; }
  var p = finished ? idx+2 : idx+1;         // finished=本页已讲完 → 下次从下页开始
  if(p>TOTAL) p=TOTAL;
  setBp(cur(),p);
  save(); writeHash();
  toast(cls(cur()).name+"：下次从 P"+p+" 开始"+(finished?"（本页已讲完）":"（本页需重讲）"));
  renderCls(); go(idx,true);
}
function renderTopbar(){
  var c=cls(cur());
  $("#clsName").textContent = c?c.name:"选择班级";
  $("#fabCls").textContent  = c?c.name:"?";
  $("#fab").classList.toggle("show", !!c);
  $("#resume").style.display = "none";
  if(c){
    var p=bp(c.id);
    if(p>1 && p<=TOTAL){            // p=1 = 还没开课，不显示定位条
      $("#rFrom").textContent="P"+(p-1);
      $("#rTo").textContent="P"+p;
      var r=$("#resume"); r.style.display="flex"; r.classList.remove("mini");
      clearTimeout(window._rt);
      window._rt=setTimeout(function(){ r.classList.add("mini"); },8000);
    }
    else if(p===1 && TOTAL>0){
      // 从头开始的情况：只在悬浮钮上体现
      $("#fabPg").textContent="从头";
    }
  }
  $$("#dots i").forEach(function(d,i){ d.classList.toggle("bp",!!c&&bp(c.id)>0&&i===bp(c.id)-1); });
}
function renderLectures(){
  var sel=$("#lecSel");
  /* 优先用 DECK.lectures（浏览器内批量导入的多讲次），其次用预配置 LECTURES */
  var list=(DECK&&DECK.lectures&&DECK.lectures.length)?DECK.lectures:LECTURES;
  if(!list||list.length<2){ sel.style.display="none"; return; }
  sel.style.display="";
  sel.innerHTML="";
  list.forEach(function(l){
    var o=document.createElement("option");
    o.value=l.id; o.textContent=l.title||l.name||l.id;
    if(l.id===LID) o.selected=true;
    sel.appendChild(o);
  });
  sel.onchange=function(){
    if(!sel.value) return;
    if(DECK&&DECK.lectures&&DECK.lectures.length){
      switchLecture(sel.value);  /* 同文件内切讲次 */
    }else{
      location.href=sel.value+"#"+hashStr();  /* 预配置讲次：跳转文件 */
    }
  };
}
function renderCls(){
  renderLectures();
  var g=$("#clsGrid"); g.innerHTML="";
  S.classes.forEach(function(c,i){
    var p=bp(c.id);
    var d=document.createElement("div");
    d.className="clsCard"+(c.id===cur()?" cur":"");
    d.innerHTML='<button class="cdel" title="删除这个班">×</button>'+
                '<div class="cn" data-id="'+c.id+'">'+esc(c.name)+'</div>'+
                '<div class="cp">'+(p>1?("讲到 P"+(p-1)+" · 下次 P"+p):(p===1?"未开课 · 从头开始":"未开始"))+'</div>';
    d.querySelector(".cdel").onclick=function(e){ e.stopPropagation(); delCls(c.id); };
    d.querySelector(".cn").style.color=CLR[i%CLR.length];
    var clickTimer=null;
    d.onclick=function(e){
      if(e.target.classList.contains("cn")&&e.target.isContentEditable) return;
      if(e.target.classList.contains("cn")){
        if(clickTimer) clearTimeout(clickTimer);
        clickTimer=setTimeout(function(){
          S.current=c.id; save(); writeHash(); closeCls(); renderTopbar(); autoJump(true);
        },250);
        return;
      }
      S.current=c.id; save(); writeHash(); closeCls(); renderTopbar(); autoJump(true);
    };
    var cn=d.querySelector(".cn");
    cn.ondblclick=function(e){
      if(clickTimer){ clearTimeout(clickTimer); clickTimer=null; }
      e.stopPropagation(); cn.contentEditable="true"; cn.style.outline="1px dashed #6b8299"; cn.focus();
      document.getSelection().selectAllChildren(cn);
    };
    cn.onblur=function(){
      cn.contentEditable="false"; cn.style.outline="none";
      var v=(cn.textContent||"").trim(); if(v&&v!==c.name){ c.name=v.slice(0,20); }
      cn.textContent=c.name; save(); renderCls(); renderTopbar();
    };
    cn.onkeydown=function(e){ if(e.key==="Enter"){ e.preventDefault(); cn.blur(); } e.stopPropagation(); };
    g.appendChild(d);
  });
  /* 添加班级 */
  var add=document.createElement("div");
  add.className="clsCard add";
  add.innerHTML='<div class="cn" style="color:#7f95a9">＋ 添加班级</div><div class="cp">&nbsp;</div>';
  add.onclick=function(){
    var n=prompt("新班级的名字（如「导演2601」）：","班级"+(S.classes.length+1));
    if(n===null) return;
    var c=addCls(n.trim()||("班级"+(S.classes.length+1)));
    if(!cur()) S.current=c.id;
    save(); writeHash(); renderTopbar(); toast("已添加 "+c.name);
  };
  g.appendChild(add);
  // 总览里的班级 chips
  var ch=$("#ovChips"); ch.innerHTML="";
  S.classes.forEach(function(c){
    var b=document.createElement("span");
    b.className="chip"+(c.id===cur()?" on":"");
    b.textContent=c.name+(bp(c.id)>0?(" · P"+bp(c.id)):"");
    b.onclick=function(){ S.current=c.id; save(); writeHash(); renderTopbar(); renderOverview(); };
    ch.appendChild(b);
  });
}
function openCls(){ renderCls(); $("#clsOverlay").classList.add("show"); }
function closeCls(){ $("#clsOverlay").classList.remove("show"); }
function autoJump(explicit){
  var p=bp(cur()); if(!p||p<1) return;
  var target=p-1; if(target<0) target=0; if(target>TOTAL-1) target=TOTAL-1;
  if(target!==0 || explicit) go(target);
}

/* ================= 总览 ================= */
function renderOverview(){
  var g=$("#ovGrid"); g.innerHTML="";
  var p=bp(cur());
  var slides=$$("#deck .slide");
  slides.forEach(function(sl,i){
    var cell=document.createElement("div");
    cell.className="ovcell"+(p>0&&i<p-1?" done":"")+(p>0&&i===p-1?" bp":"");
    var th=document.createElement("div"); th.className="thumb";
    var sc=document.createElement("div"); sc.className="sc";
    sc.appendChild(sl.cloneNode(true));
    sc.style.transform="scale(0.1797)";
    th.innerHTML='<span class="num">'+(i+1)+'</span>';
    th.appendChild(sc);
    if(i===p-1){ var f=document.createElement("span"); f.className="flag"; f.textContent="▶ 继续"; th.appendChild(f); }
    th.onclick=function(){ closeOv(); go(i); };
    cell.appendChild(th);
    g.appendChild(cell);
  });
}
function openOv(){ renderOverview(); $("#ovp").classList.add("show"); }
function closeOv(){ $("#ovp").classList.remove("show"); }

/* ================= 备注 ================= */
var noteScope="all";
function renderNotes(){
  $("#noteTitle").textContent="第 "+(idx+1)+" 页备注";
  $("#noteSub").textContent=TITLE+" · "+(noteScope==="all"?"全课程可见":"仅 "+cls(cur()).name+" 可见");
  var list=(S.notes[LID]||{})[String(idx+1)]||[];
  var box=$("#noteList"); box.innerHTML="";
  var shown=list.filter(function(n){ return noteScope==="all" ? n.scope==="all" : (n.scope==="class"&&n.owner===cur()); });
  if(!shown.length){ box.innerHTML='<div class="empty">还没有备注。写在下面保存即可。</div>'; return; }
  shown.forEach(function(n){
    var d=document.createElement("div");
    d.className="nitem"+(n.scope==="class"?" cls":"");
    var who = n.scope==="all" ? "全课程" : (cls(n.owner)?cls(n.owner).name:"某班");
    d.innerHTML='<div class="meta"><span>'+who+' · '+esc(n.t.slice(0,16).replace("T"," "))+'</span>'+
                '<span class="del">删除</span></div><div class="body">'+esc(n.text)+'</div>';
    d.querySelector(".del").onclick=function(){
      var arr=(S.notes[LID]||{})[String(idx+1)]||[];
      var k=arr.indexOf(n); if(k>=0) arr.splice(k,1);
      save(); renderNotes(); toast("已删除");
    };
    box.appendChild(d);
  });
}
function saveNote(){
  var t=$("#noteInput").value.trim(); if(!t){ toast("内容是空的"); return; }
  if(!S.notes[LID]) S.notes[LID]={};
  var key=String(idx+1);
  if(!S.notes[LID][key]) S.notes[LID][key]=[];
  S.notes[LID][key].push({
    scope: noteScope==="all"?"all":"class",
    owner: noteScope==="all"?null:cur(),
    text:t, t:new Date().toISOString()
  });
  save(); $("#noteInput").value=""; renderNotes(); toast("备注已保存");
}
function openNote(){ if(!cur()){ openCls(); return; } renderNotes(); $("#note").classList.add("show"); }
function closeNote(){ $("#note").classList.remove("show"); }

/* ================= 数据导入导出 ================= */
function exportJSON(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="叙事理论-进度备份-"+new Date().toISOString().slice(0,10)+".json";
  a.click(); setTimeout(function(){URL.revokeObjectURL(a.href)},3000);
  toast("已导出备份文件");
}
/* 导出工程数据（IR JSON：全部课件内容，可再次导入/由其它工具消费） */
function exportDeckJSON(){
  if(!DECK){ toast("本页没有工程数据（IR），无法导出"); return; }
  var blob=new Blob([JSON.stringify(DECK,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(DECK.title||DECK.id||"deck")+"-工程数据-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },3000);
  toast("已导出工程数据（含全部课件内容 IR）");
}
/* 导入工程数据后，清掉超出总页数的断点，避免残页引用 */
function sanitizeProgress(){
  if(!S||!S.progress) return;
  for(var cid in S.progress){ for(var lid in S.progress[cid]){
    var p=S.progress[cid][lid];
    if(!p||!p.p||p.p<=0||p.p>TOTAL) delete S.progress[cid][lid];
  }}
}
/* 应用一份工程数据（IR）：重渲染课件，进度/班级保持本页配置 */
function applyDeck(deck){
  DECK=deck;
  if(editingText) commitTextEdit();
  drag=null; selSlide=-1; selShape=-1;
  undoStack=[]; redoStack=[]; renderEditUI(); hideSelBox();
  LID=deck.id||LID; TITLE=deck.title||TITLE;
  document.title=TITLE;
  var tt=document.querySelector(".tb-title"); if(tt) tt.textContent=TITLE;
  var sub=document.querySelector(".tb-sub"); if(sub) sub.textContent=LID;
  document.getElementById("deck").innerHTML=renderSlides(DECK).join("\n");
  TOTAL=DECK.slides.length;
  /* 多讲次：确保当前讲次在 lectures 中是同一个引用，编辑器修改自动回存 */
  if(DECK.lectures&&DECK.lectures.length){
    DECK.lectures.forEach(function(l,i){ if(l.id===LID) DECK.lectures[i]=DECK; });
  }
  buildDots(); sanitizeProgress(); save();
  idx=0; go(0,true); renderCls(); renderTopbar(); writeHash();
  toast("已导入工程数据："+(TITLE||LID)+"（"+TOTAL+" 页，本次会话生效）");
}
$("#fileIn").onchange=function(e){
  var f=e.target.files[0]; if(!f) return;
  e.target.value="";
  /* 智能分流：.pptx 走浏览器内 PPT 导入，其余按 JSON 处理 */
  if(/\.pptx$/i.test(f.name||"")){
    if(window.PPTXImport&&typeof window.PPTXImport.fromFile==="function"){ importPptxFile(f); return; }
    toast("当前文件未内置 PPT 导入器，请用「导入PPT」或重新转换产物"); return;
  }
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(o&&o.slides&&Array.isArray(o.slides)){
        if(!o.slides.length) throw 0;
        applyDeck(o);              /* 工程数据（IR）→ 重渲染 */
      }else if(o&&o.classes){
        S=o; if(!cur()) S.current=S.classes[0].id;
        sanitizeProgress(); save(); renderCls(); renderTopbar(); autoJump(true); writeHash();
        toast("已导入进度");
      }else{ throw 0; }
    }catch(err){ toast("文件格式不对，导入失败"); }
  };
  r.readAsText(f);
};

/* ================= 浏览器内导入 PPTX（第二阶段：解析在浏览器完成） ================= */
function blobToDataURL(blob){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){ res(fr.result); };
    fr.onerror=function(){ rej(fr.error); };
    fr.readAsDataURL(blob);
  });
}
function importPptxFile(f){
  if(!f) return;
  var name=String(f.name||"").replace(/\.pptx$/i,"").replace(/[\\/:*?"<>|]/g,"_").slice(0,40)||"deck";
  toast("正在浏览器内解析 "+name+" …");
  window.PPTXImport.fromFile(f,{id:name,title:name}).then(function(deck){
    /* 把 pptx-viewer 产生的 blob: 图片转 dataURL，确保保存后持久化 */
    var imgs=[];
    (deck.slides||[]).forEach(function(s){
      (s.shapes||[]).forEach(function(sh){
        if(sh.t==="i"&&sh.src&&sh.src.indexOf("blob:")===0) imgs.push(sh);
      });
    });
    var finish=function(){
      applyDeck(deck);
      var sk=deck.skipped||{}, parts=Object.keys(sk).map(function(k){return k+":"+sk[k]});
      toast("已导入 "+name+"（"+deck.slides.length+" 页）"+(parts.length?("；降级跳过 "+parts.join("，")):""));
    };
    if(!imgs.length){ finish(); return; }
    var done=0;
    imgs.forEach(function(sh){
      fetch(sh.src).then(function(r){return r.blob()}).then(function(b){return blobToDataURL(b)}).then(function(d){
        sh.src=d;
      }).catch(function(){ /* 转换失败保留原 blob，至少当前会话可见 */ }).then(function(){
        done++; if(done===imgs.length) finish();
      });
    });
  }).catch(function(err){
    toast("解析失败："+(err&&err.message?err.message:String(err)));
  });
}
/* 批量导入多个 PPTX，合并成一整门课（多讲次） */
function importMultiplePptx(files){
  if(!files||!files.length) return;
  /* 按文件名排序，保证讲次顺序 */
  files.sort(function(a,b){ return String(a.name).localeCompare(String(b.name),"zh-CN"); });
  var total=files.length, done=0, failed=0, lectures=[];
  toast("正在导入 "+total+" 个 PPTX…（0/"+total+"）");
  files.forEach(function(f,idx){
    var name=String(f.name||"").replace(/\.pptx$/i,"").replace(/[\\/:*?"<>|]/g,"_").slice(0,40)||("讲次"+(idx+1));
    var lid="L"+String(idx+1).padStart(2,"0");
    window.PPTXImport.fromFile(f,{id:lid,title:name}).then(function(deck){
      deck.id=lid; deck.name=name; deck.title=name;
      /* blob 图片转 dataURL */
      var imgs=[];
      (deck.slides||[]).forEach(function(s){
        (s.shapes||[]).forEach(function(sh){
          if(sh.t==="i"&&sh.src&&sh.src.indexOf("blob:")===0) imgs.push(sh);
        });
      });
      var finishOne=function(){
        lectures.push(deck); done++;
        toast("正在导入…（"+done+"/"+total+"）"+(failed?(" 失败"+failed):""));
        if(done+failed===total){
          if(lectures.length){
            /* 按讲次 ID 排序 */
            lectures.sort(function(a,b){ return String(a.id).localeCompare(String(b.id)); });
            /* 把所有讲次存入 DECK.lectures，第一个讲次作为当前 */
            var first=lectures[0];
            first.lectures=lectures;
            applyDeck(first);
            toast("已导入整门课："+lectures.length+" 个讲次，共 "+lectures.reduce(function(s,l){return s+(l.slides?l.slides.length:0);},0)+" 页");
          }else{
            toast("全部导入失败");
          }
        }
      };
      if(!imgs.length){ finishOne(); return; }
      var imgDone=0;
      imgs.forEach(function(sh){
        fetch(sh.src).then(function(r){return r.blob()}).then(function(b){return blobToDataURL(b)}).then(function(d){
          sh.src=d;
        }).catch(function(){}).then(function(){
          imgDone++; if(imgDone===imgs.length) finishOne();
        });
      });
    }).catch(function(err){
      failed++; done++;
      console.error("导入失败",name,err);
      if(done+failed===total){
        if(lectures.length){
          lectures.sort(function(a,b){ return String(a.id).localeCompare(String(b.id)); });
          var first=lectures[0]; first.lectures=lectures; applyDeck(first);
          toast("已导入 "+lectures.length+"/"+total+" 个讲次（"+failed+" 个失败）");
        }else{
          toast("全部导入失败");
        }
      }
    });
  });
}
/* 切换讲次（同文件内，不跳转页面） */
function switchLecture(lid){
  if(!DECK||!DECK.lectures||!DECK.lectures.length) return;
  var found=null;
  DECK.lectures.forEach(function(l){ if(l.id===lid) found=l; });
  if(!found){ toast("找不到讲次 "+lid); return; }
  if(found.id===LID) return;
  /* 保存当前讲次的修改回 lectures */
  DECK.lectures.forEach(function(l,i){ if(l.id===LID) DECK.lectures[i]=DECK; });
  found.lectures=DECK.lectures;
  applyDeck(found);
}
function initPptxImport(){

/* ================= 编辑器（G2=B 自研精简：选择/移动/缩放/改字/撤销重做/删除/复制/保存） ================= */
var EDIT=false, selSlide=-1, selShape=-1;
var undoStack=[], redoStack=[];
var drag=null, editingText=null, CROP_MODE=false;

function selSh(){
  if(selSlide<0||selShape<0||!DECK||!DECK.slides[selSlide]||!DECK.slides[selSlide].shapes[selShape]) return null;
  return DECK.slides[selSlide].shapes[selShape];
}
function stageScale(){ var r=stage.getBoundingClientRect(); return (r.width/1280)||1; }
function syncShape(si,hi){
  var el=document.querySelector('.slide[data-n="'+(si+1)+'"] .sh[data-sh="'+hi+'"]');
  var sh=DECK.slides[si]&&DECK.slides[si].shapes[hi];
  if(el&&sh){ el.style.left=sh.x+"px"; el.style.top=sh.y+"px"; el.style.width=sh.w+"px"; el.style.height=sh.h+"px"; }
}
function hideSelBox(){ var b=$("#selbox"); if(b) b.classList.remove("show"); }
function updateSelBox(){
  var box=$("#selbox"); if(!box) return;
  var sh=selSh();
  if(!sh||!EDIT||!DECK){ hideSelBox(); return; }
  var slideEl=document.querySelector('.slide[data-n="'+(selSlide+1)+'"]');
  if(!slideEl){ hideSelBox(); return; }
  var host=$("#stage");
  if(box.parentElement!==host) host.appendChild(box);
  if(CROP_MODE&&sh.t==="i"){
    var c=sh.crop||{t:0,r:0,b:0,l:0};
    box.style.left=(sh.x+c.l)+"px"; box.style.top=(sh.y+c.t)+"px";
    box.style.width=Math.max(4,sh.w-c.l-c.r)+"px"; box.style.height=Math.max(4,sh.h-c.t-c.b)+"px";
    box.classList.add("show","crop");
    return;
  }
  box.classList.remove("crop");
  box.style.left=sh.x+"px"; box.style.top=sh.y+"px";
  box.style.width=sh.w+"px"; box.style.height=sh.h+"px";
  box.classList.add("show");
}
function clearSel(){
  if(CROP_MODE) exitCrop();
  $$("#deck .sh.sel").forEach(function(el){ el.classList.remove("sel"); });
  selSlide=-1; selShape=-1; hideSelBox(); renderEditUI();
}
function selectAt(si,hi){
  $$("#deck .sh.sel").forEach(function(el){ el.classList.remove("sel"); });
  selSlide=si; selShape=hi;
  var el=document.querySelector('.slide[data-n="'+(si+1)+'"] .sh[data-sh="'+hi+'"]');
  if(el) el.classList.add("sel");
  updateSelBox(); renderEditUI();
}
function renderEditUI(){
  var u=$("#edUndo"), r=$("#edRedo");
  if(u) u.disabled=!undoStack.length;
  if(r) r.disabled=!redoStack.length;
  /* 字号控件：仅选中文本框时启用 */
  var fs=$("#edFsVal"), minus=$("#edFsMinus"), plus=$("#edFsPlus");
  if(fs){
    var sh=selSh(), enabled=!!(sh&&sh.t==="t");
    fs.disabled=!enabled;
    if(minus) minus.disabled=!enabled;
    if(plus) plus.disabled=!enabled;
    if(enabled){
      var cur=currentFontSize(sh);
      if(cur&&document.activeElement!==fs) fs.value=cur;
    } else if(document.activeElement!==fs){ fs.value=""; }
  }
  /* 图片按钮：仅选中图片时启用 */
  var fitBtn=$("#edFit"), cropBtn=$("#edCrop");
  var isImg=!!(sh&&sh.t==="i");
  if(fitBtn) fitBtn.disabled=!isImg;
  if(cropBtn){ cropBtn.disabled=!isImg; cropBtn.classList.toggle("on",CROP_MODE); }
}
function currentFontSize(sh){
  if(!sh||!sh.p) return null;
  for(var i=0;i<sh.p.length;i++){
    var runs=sh.p[i].runs||[];
    for(var j=0;j<runs.length;j++){ if(runs[j].s) return runs[j].s; }
  }
  /* 全部未显式设置（s=null）：取 DOM 实际渲染字号 */
  var el=document.querySelector('.slide[data-n="'+(selSlide+1)+'"] .sh[data-sh="'+selShape+'"] .tf span');
  if(el){ var fs=parseFloat(getComputedStyle(el).fontSize); if(fs) return Math.round(fs); }
  return 16;
}
function setFontSize(size){
  var sh=selSh(); if(!sh||sh.t!=="t") return;
  var si=selSlide, hi=selShape;
  size=Math.max(8,Math.min(300,Math.round(Number(size)||0)));
  if(!size) return;
  var before=JSON.parse(JSON.stringify(sh.p||[]));
  (sh.p||[]).forEach(function(p){
    (p.runs||[]).forEach(function(r){ r.s=size; });
  });
  var after=JSON.parse(JSON.stringify(sh.p));
  renderSlideAt(si);
  selectAt(si,hi);
  if(JSON.stringify(before)===JSON.stringify(after)) return;   /* 无变化不入撤销栈 */
  pushUndo({undo:function(){ DECK.slides[si].shapes[hi].p=before; renderSlideAt(si); selectAt(si,hi); },
            redo:function(){ DECK.slides[si].shapes[hi].p=after; renderSlideAt(si); selectAt(si,hi); }});
  toast("字号已设为 "+size+"px");
}
/* ---- 图片填充模式（contain 等比 / cover 铺满 / fill 拉伸） ---- */
function setFit(){
  var sh=selSh(); if(!sh||sh.t!=="i") return;
  var si=selSlide, hi=selShape;
  var order=["contain","cover","fill"];
  var cur=sh.fit||"contain";
  var next=order[(order.indexOf(cur)+1)%order.length];
  var before=sh.fit||"contain";
  sh.fit=next;
  renderSlideAt(si); selectAt(si,hi);
  pushUndo({undo:function(){ DECK.slides[si].shapes[hi].fit=before; renderSlideAt(si); selectAt(si,hi); },
            redo:function(){ DECK.slides[si].shapes[hi].fit=next; renderSlideAt(si); selectAt(si,hi); }});
  var label=next==="contain"?"等比(留空白)":next==="cover"?"铺满(裁切)":"拉伸";
  toast("图片填充："+label);
}
/* ---- 图片裁剪（crop={t,r,b,l} 内缩 px；裁剪模式下 selbox 显示裁剪区域） ---- */
function exitCrop(){
  if(!CROP_MODE) return;
  CROP_MODE=false;
  var btn=$("#edCrop"); if(btn) btn.classList.remove("on");
  updateSelBox(); renderEditUI();
}
function toggleCrop(){
  var sh=selSh(); if(!sh||sh.t!=="i") return;
  if(CROP_MODE){ exitCrop(); return; }
  if(!sh.crop) sh.crop={t:0,r:0,b:0,l:0};
  CROP_MODE=true;
  $("#edCrop").classList.add("on");
  updateSelBox(); renderEditUI();
  toast("裁剪模式：拖手柄调整边界，拖动平移区域，再点「裁剪」完成");
}
function pushUndo(u){ undoStack.push(u); if(undoStack.length>60) undoStack.shift(); redoStack.length=0; renderEditUI(); }
function undo(){
  if(editingText) commitTextEdit();
  var u=undoStack.pop(); if(!u) return;
  u.undo(); redoStack.push(u); renderEditUI(); updateSelBox();
}
function redo(){
  if(editingText) commitTextEdit();
  var u=redoStack.pop(); if(!u) return;
  u.redo(); undoStack.push(u); renderEditUI(); updateSelBox();
}
function setEdit(on){
  EDIT=on;
  document.body.classList.toggle("editing",on);
  var b=$("#editBtn"); if(b) b.classList.toggle("on",on);
  var t=$("#edToolbar"); if(t) t.classList.toggle("show",on);
  if(!on){ if(editingText) commitTextEdit(); if(CROP_MODE) exitCrop(); drag=null; clearSel(); }
  else toast("编辑模式：点选元素，拖动移动，拖手柄缩放，双击改字，Delete 删除，Ctrl+Z/Y 撤销重做");
}

/* ---- 移动 / 缩放（舞台坐标换算，写回 IR） ---- */
$("#viewport").addEventListener("mousedown",function(e){
  if(!EDIT||e.button!==0) return;
  var t=e.target;
  var handle=t.closest?t.closest("#selbox i"):null;
  if(handle){
    e.preventDefault();
    var sh=selSh(); if(!sh) return;
    if(CROP_MODE&&sh.t==="i"){
      var c=sh.crop||{t:0,r:0,b:0,l:0};
      drag={mode:"cropResize",dir:handle.getAttribute("data-dir"),sx:e.clientX,sy:e.clientY,
            ol:c.l,or:c.r,ot:c.t,ob:c.b,ow:sh.w,oh:sh.h};
    }else{
      drag={mode:"resize",dir:handle.getAttribute("data-dir"),sx:e.clientX,sy:e.clientY,ox:sh.x,oy:sh.y,ow:sh.w,oh:sh.h};
    }
    return;
  }
  var shEl=t.closest?t.closest(".sh"):null;
  if(shEl&&shEl.closest(".slide")){
    e.preventDefault();
    var slideEl=shEl.closest(".slide");
    var si=parseInt(slideEl.getAttribute("data-n"),10)-1;
    var hi=parseInt(shEl.getAttribute("data-sh"),10);
    var sh=DECK.slides[si]&&DECK.slides[si].shapes[hi];
    if(!sh) return;
    if(editingText) commitTextEdit();
    selectAt(si,hi);
    if(CROP_MODE&&sh.t==="i"){
      var c2=sh.crop||{t:0,r:0,b:0,l:0};
      drag={mode:"cropMove",sx:e.clientX,sy:e.clientY,ol:c2.l,or:c2.r,ot:c2.t,ob:c2.b};
    }else{
      drag={mode:"move",si:si,hi:hi,sx:e.clientX,sy:e.clientY,ox:sh.x,oy:sh.y};
    }
    return;
  }
  clearSel();
});
document.addEventListener("mousemove",function(e){
  if(!drag) return;
  e.preventDefault();
  var sc=stageScale();
  var dx=(e.clientX-drag.sx)/sc, dy=(e.clientY-drag.sy)/sc;
  if(drag.mode==="move"){
    var sh=DECK.slides[drag.si].shapes[drag.hi];
    sh.x=Math.round(drag.ox+dx); sh.y=Math.round(drag.oy+dy);
    var el=document.querySelector('.slide[data-n="'+(drag.si+1)+'"] .sh[data-sh="'+drag.hi+'"]');
    if(el){ el.style.left=sh.x+"px"; el.style.top=sh.y+"px"; }
    updateSelBox();
  }else if(drag.mode==="resize"){
    var sh2=selSh(); if(!sh2) return;
    var d=drag.dir, x=drag.ox, y=drag.oy, w=drag.ow, h=drag.oh;
    if(d.indexOf("w")>=0){ x=drag.ox+dx; w=drag.ow-dx; }
    if(d.indexOf("e")>=0){ w=drag.ow+dx; }
    if(d.indexOf("n")>=0){ y=drag.oy+dy; h=drag.oh-dy; }
    if(d.indexOf("s")>=0){ h=drag.oh+dy; }
    if(w<8){ if(d.indexOf("w")>=0) x=drag.ox+drag.ow-8; w=8; }
    if(h<8){ if(d.indexOf("n")>=0) y=drag.oy+drag.oh-8; h=8; }
    sh2.x=Math.round(x); sh2.y=Math.round(y); sh2.w=Math.round(w); sh2.h=Math.round(h);
    syncShape(selSlide,selShape);
    updateSelBox();
  }else if(drag.mode==="cropResize"){
    var sh3=selSh(); if(!sh3||!sh3.crop) return;
    var c=sh3.crop, dir=drag.dir;
    /* crop 是内缩量：e 手柄右拖→r 减小；w 左拖→l 减小；n 上拖→t 减小；s 下拖→b 减小 */
    if(dir.indexOf("e")>=0){ c.r=Math.max(0,Math.round(drag.or-dx)); }
    if(dir.indexOf("w")>=0){ c.l=Math.max(0,Math.round(drag.ol+dx)); }
    if(dir.indexOf("s")>=0){ c.b=Math.max(0,Math.round(drag.ob-dy)); }
    if(dir.indexOf("n")>=0){ c.t=Math.max(0,Math.round(drag.ot+dy)); }
    /* 约束：裁剪区域至少 8px */
    if(c.l+c.r>sh3.w-8){ c.r=sh3.w-8-c.l; if(c.r<0){c.r=0;c.l=sh3.w-8;} }
    if(c.t+c.b>sh3.h-8){ c.b=sh3.h-8-c.t; if(c.b<0){c.b=0;c.t=sh3.h-8;} }
    renderSlideAt(selSlide); updateSelBox();
  }else if(drag.mode==="cropMove"){
    var sh4=selSh(); if(!sh4||!sh4.crop) return;
    var c4=sh4.crop;
    c4.l=Math.max(0,Math.round(drag.ol+dx)); c4.r=Math.max(0,Math.round(drag.or-dx));
    c4.t=Math.max(0,Math.round(drag.ot+dy)); c4.b=Math.max(0,Math.round(drag.ob-dy));
    /* 约束区域不超出形状 */
    if(c4.l+c4.r>sh4.w-8){ var ex=c4.l+c4.r-(sh4.w-8); c4.l=Math.max(0,c4.l-ex/2); c4.r=Math.max(0,c4.r-ex/2); }
    if(c4.t+c4.b>sh4.h-8){ var ey=c4.t+c4.b-(sh4.h-8); c4.t=Math.max(0,c4.t-ey/2); c4.b=Math.max(0,c4.b-ey/2); }
    renderSlideAt(selSlide); updateSelBox();
  }
});
document.addEventListener("mouseup",function(){
  if(!drag) return;
  var d=drag; drag=null;
  if(d.mode==="move"){
    var sh=DECK.slides[d.si].shapes[d.hi];
    if(sh.x!==d.ox||sh.y!==d.oy){
      var ax=sh.x, ay=sh.y;
      pushUndo({undo:function(){ sh.x=d.ox; sh.y=d.oy; syncShape(d.si,d.hi); updateSelBox(); },
                redo:function(){ sh.x=ax; sh.y=ay; syncShape(d.si,d.hi); updateSelBox(); }});
    }
  }else if(d.mode==="resize"){
    var sh2=selSh(); if(!sh2) return;
    var rsi=selSlide, rhi=selShape;
    if(sh2.x!==d.ox||sh2.y!==d.oy||sh2.w!==d.ow||sh2.h!==d.oh){
      var ax2=sh2.x, ay2=sh2.y, aw2=sh2.w, ah2=sh2.h;
      pushUndo({undo:function(){ sh2.x=d.ox; sh2.y=d.oy; sh2.w=d.ow; sh2.h=d.oh; syncShape(rsi,rhi); updateSelBox(); },
                redo:function(){ sh2.x=ax2; sh2.y=ay2; sh2.w=aw2; sh2.h=ah2; syncShape(rsi,rhi); updateSelBox(); }});
    }
  }else if(d.mode==="cropResize"||d.mode==="cropMove"){
    var sh5=selSh(); if(!sh5||!sh5.crop) return;
    var csi=selSlide, chi=selShape;
    var before={t:d.ot,r:d.or,b:d.ob,l:d.ol};
    var after={t:sh5.crop.t,r:sh5.crop.r,b:sh5.crop.b,l:sh5.crop.l};
    if(before.t!==after.t||before.r!==after.r||before.b!==after.b||before.l!==after.l){

                redo:function(){ DECK.slides[csi].shapes[chi].crop={t:after.t,r:after.r,b:after.b,l:after.l}; renderSlideAt(csi); selectAt(csi,chi); }});

/* ---- 双击改字（文本框；编辑后段落级合并为单 run，保留段首 run 样式） ---- */
$("#viewport").addEventListener("dblclick",function(e){
  if(!EDIT) return;
  var shEl=e.target.closest?e.target.closest(".sh"):null;
  if(!shEl||!shEl.closest(".slide")) return;
  var slideEl=shEl.closest(".slide");
  var si=parseInt(slideEl.getAttribute("data-n"),10)-1;
  var hi=parseInt(shEl.getAttribute("data-sh"),10);
  var sh=DECK.slides[si]&&DECK.slides[si].shapes[hi];
  if(!sh||sh.t!=="t") return;
  e.preventDefault();
  selectAt(si,hi);
  var tf=shEl.querySelector(".tf"); if(!tf) return;
  var saved=(sh.p||[]).map(function(p){
    return {p:p, text:(p.runs||[]).map(function(r){return r.tx||""}).join("")};
  });
  tf.setAttribute("contenteditable","true");
  tf.classList.add("editing");
  editingText={tf:tf,si:si,hi:hi,saved:saved,sh:sh};
  tf.addEventListener("blur",function(){ if(editingText) commitTextEdit(); },{once:true});
  var r=document.createRange(); r.selectNodeContents(tf); r.collapse(false);
  var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
});
function commitTextEdit(){
  var et=editingText; editingText=null;
  if(!et) return;
  var tf=et.tf;
  tf.setAttribute("contenteditable","false");
  tf.classList.remove("editing");
  var pEls=tf.querySelectorAll(".p");
  var newP=[], i=0;
  pEls.forEach(function(pEl){
    var text=pEl.textContent.replace(/\u00a0/g," ").replace(/\s+$/,"");
    var orig=et.saved[Math.min(i,et.saved.length-1)];
    var base=orig?orig.p:{};
    var np={runs:[]};
    if(text){
      var ro={tx:text};
      var r0=base.runs&&base.runs[0];
      if(r0){ if(r0.s)ro.s=r0.s; if(r0.f)ro.f=r0.f; if(r0.c)ro.c=r0.c; if(r0.b)ro.b=r0.b; if(r0.i)ro.i=r0.i; if(r0.u)ro.u=r0.u; }
      np.runs=[ro];
    }
    if(base.al)np.al=base.al; if(base.lh)np.lh=base.lh; if(base.lsu)np.lsu=base.lsu;
    if(base.sb)np.sb=base.sb; if(base.sa)np.sa=base.sa;
    newP.push(np); i++;
  });
  if(!newP.length) newP=[{runs:[]}];
  var sh=et.sh, si=et.si, hi=et.hi;
  var before=JSON.parse(JSON.stringify(sh.p||[]));
  sh.p=newP;
  renderSlideAt(si);
  selectAt(si,hi);
  var after=JSON.parse(JSON.stringify(sh.p));
  pushUndo({undo:function(){ DECK.slides[si].shapes[hi].p=before; renderSlideAt(si); selectAt(si,hi); },
            redo:function(){ DECK.slides[si].shapes[hi].p=after; renderSlideAt(si); selectAt(si,hi); }});
}

/* ================= M3：IndexedDB 草稿自动保存 ================= */
var DB_NAME="pptx-deck-drafts", DB_STORE="drafts", _draftTimer=null;
function openDB(){
  return new Promise(function(res,rej){
    try{
      var r=indexedDB.open(DB_NAME,1);
      r.onupgradeneeded=function(){ if(!r.result.objectStoreNames.contains(DB_STORE)) r.result.createObjectStore(DB_STORE); };
      r.onsuccess=function(){ res(r.result); };
      r.onerror=function(){ rej(r.error); };
    }catch(e){ rej(e); }
  });
}
function saveDraft(id, deck){
  if(!id||!deck) return;
  openDB().then(function(db){
    var tx=db.transaction(DB_STORE,"readwrite");
    tx.objectStore(DB_STORE).put({deck:JSON.parse(JSON.stringify(deck)), ts:Date.now()}, id);
  }).catch(function(){});
}
function getDraft(id){
  return openDB().then(function(db){
    return new Promise(function(res,rej){
      var r=db.transaction(DB_STORE).objectStore(DB_STORE).get(id);
      r.onsuccess=function(){ res(r.result||null); };
      r.onerror=function(){ rej(r.error); };
    });
  }).catch(function(){ return null; });
}
function clearDraft(id){
  openDB().then(function(db){
    var tx=db.transaction(DB_STORE,"readwrite");
    tx.objectStore(DB_STORE).delete(id);
  }).catch(function(){});
}
function scheduleDraftSave(){
  if(!EDIT||!DECK||!DECK.id) return;
  if(_draftTimer) clearTimeout(_draftTimer);
  _draftTimer=setTimeout(function(){ saveDraft(DECK.id, DECK); }, 800);
}
/* pushUndo 时触发草稿保存（防抖） */
var _origPushUndo=pushUndo;
pushUndo=function(u){ _origPushUndo(u); scheduleDraftSave(); };
/* 打开时检查草稿并提示恢复 */
function checkDraftOnLoad(){
  if(!DECK||!DECK.id) return;
  getDraft(DECK.id).then(function(d){
    if(!d||!d.deck||!d.deck.slides) return;

      applyDeck(d.deck);

    }else{

    }
  });
}

/* ================= M3：同步码（无后端跨设备传课件） ================= */
function abToB64(buf){
  var bytes=new Uint8Array(buf), bin="";
  for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64ToAB(b64){
  var bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes.buffer;
}
async function genSyncCode(){
  if(!DECK||!DECK.slides||!DECK.slides.length){ toast("没有课件数据"); return ""; }
  var json=JSON.stringify(DECK);
  var code;
  try{
    var cs=new CompressionStream("gzip");
    var w=cs.writable.getWriter();
    w.write(new TextEncoder().encode(json)); w.close();
    var buf=await new Response(cs.readable).arrayBuffer();
    code="deckgz:"+abToB64(buf);
  }catch(e){
    code="deck:"+btoa(unescape(encodeURIComponent(json)));
  }
  return code;
}
async function applySyncCode(code){
  code=(code||"").trim();
  if(!code) return;
  var json;
  if(code.indexOf("deckgz:")===0){
    var buf=b64ToAB(code.slice(7));
    var ds=new DecompressionStream("gzip");
    var w=ds.writable.getWriter(); w.write(buf); w.close();
    json=new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
  }else if(code.indexOf("deck:")===0){
    json=decodeURIComponent(escape(atob(code.slice(5))));
  }else{
    throw new Error("同步码格式不对（应以 deck: 或 deckgz: 开头）");
  }
  var deck=JSON.parse(json);
  if(!deck.slides||!deck.slides.length) throw new Error("同步码里没有课件数据");
  applyDeck(deck);
  toast("已从同步码恢复课件（"+deck.slides.length+" 页）");
}
function showSyncCodeDialog(){
  genSyncCode().then(function(code){
    if(!code) return;
    var ta=document.createElement("textarea");
    ta.value=code; ta.style.cssText="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:80%;max-width:600px;height:200px;z-index:999;padding:12px;font-size:12px;border:2px solid #e8825a;border-radius:8px;background:#1b2838;color:#e8eef5;";
    document.body.appendChild(ta);
    ta.select();
    var ok=confirm("同步码已生成（"+code.length+" 字符），已自动选中。\n\nCtrl+C 复制后，在另一设备打开课件 → 「输入同步码」粘贴即可恢复。\n\n大课件（含多图）同步码会很长，建议用「保存」下载 HTML 后传文件。\n\n确定后关闭。");
    document.body.removeChild(ta);
  });
}
function showSyncCodeInput(){
  var code=prompt("粘贴同步码（从另一设备「生成同步码」复制）：");
  if(!code) return;
  applySyncCode(code).catch(function(e){ toast("同步码解析失败："+e.message); });
}

/* ================= M3：BucketAdapter 云同步骨架（S3 兼容，需配置） ================= */
var BucketConfig=null;   /* {endpoint,bucket,accessKey,secretKey,prefix,region} */
var BucketAdapter={
  configured:function(){ return !!(BucketConfig&&BucketConfig.bucket&&BucketConfig.accessKey&&BucketConfig.secretKey); },
  configKey:"pptx-bucket-config",
  loadConfig:function(){
    try{ var raw=localStorage.getItem(this.configKey); if(raw) BucketConfig=JSON.parse(raw); }catch(e){}
  },
  saveConfig:function(cfg){
    BucketConfig=cfg;
    try{ localStorage.setItem(this.configKey,JSON.stringify(cfg)); }catch(e){}
  },
  clearConfig:function(){ BucketConfig=null; try{ localStorage.removeItem(this.configKey); }catch(e){} },
  objectKey:function(id){ return (BucketConfig.prefix||"decks/")+(id||"deck")+".html"; },
  /* S3 签名 PUT（v4）——配置后可用；未配置时提示 */
  async uploadHTML(id, htmlBlob){
    if(!this.configured()) throw new Error("请先在「云同步设置」里配置对象存储桶");
    /* 简化版：直接 PUT 到 endpoint/bucket/key（需桶配置为公开读或预签名）
       完整 v4 签名实现待桶配置后补全；当前骨架保证接口与 UI 就位 */
    var url=BucketConfig.endpoint.replace(/\/+$/,"")+"/"+BucketConfig.bucket+"/"+this.objectKey(id);
    var r=await fetch(url,{method:"PUT",body:htmlBlob,headers:{"Content-Type":"text/html;charset=utf-8"}});
    if(!r.ok) throw new Error("上传失败 HTTP "+r.status);
    return url;
  },
  async fetchHTML(id){
    if(!this.configured()) throw new Error("请先配置对象存储桶");
    var url=BucketConfig.endpoint.replace(/\/+$/,"")+"/"+BucketConfig.bucket+"/"+this.objectKey(id);
    var r=await fetch(url);
    if(!r.ok) throw new Error("下载失败 HTTP "+r.status);
    return await r.text();
  }
};
BucketAdapter.loadConfig();
function showBucketConfig(){
  var c=BucketConfig||{};
  var endpoint=prompt("对象存储 Endpoint（如 https://s3.amazonaws.com 或 https://oss-cn-beijing.aliyuncs.com）：", c.endpoint||"");
  if(endpoint===null) return;
  var bucket=prompt("Bucket 名称：", c.bucket||"");
  if(bucket===null) return;
  var ak=prompt("AccessKey（仅存本地浏览器，不上传）：", c.accessKey||"");
  if(ak===null) return;
  var sk=prompt("SecretKey（仅存本地浏览器）：", c.secretKey||"");
  if(sk===null) return;
  var prefix=prompt("对象前缀（默认 decks/）：", c.prefix||"decks/");
  BucketAdapter.saveConfig({endpoint:endpoint,bucket:bucket,accessKey:ak,secretKey:sk,prefix:prefix||"decks/"});
  toast("云同步配置已保存");
}
function uploadToBucket(){
  if(!BucketAdapter.configured()){ showBucketConfig(); return; }
  if(!DECK||!DECK.slides.length){ toast("没有课件数据"); return; }
  var enc=JSON.stringify(DECK).replace(/</g,"\\u003c");
  var html="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
  html=html.replace(/(<script type="application\/json" id="deck-data">)[\s\S]*?(<\/script>)/,"$1"+enc+"$2");
  var blob=new Blob([html],{type:"text/html;charset=utf-8"});
  toast("正在上传到云存储…");
  BucketAdapter.uploadHTML(DECK.id||"deck",blob).then(function(url){
    toast("已上传："+url);
    clearDraft(DECK.id);
  }).catch(function(e){ toast("上传失败："+e.message); });
}
function fetchFromBucket(){
  if(!BucketAdapter.configured()){ showBucketConfig(); return; }
  var id=prompt("要加载的课件 ID（即文件名，不含 .html）：", DECK&&DECK.id||"deck");
  if(!id) return;
  toast("正在从云存储加载…");
  BucketAdapter.fetchHTML(id).then(function(html){
    /* 从 HTML 里提取 #deck-data 的 JSON 并 applyDeck */
    var m=html.match(/<script type="application\/json" id="deck-data">([\s\S]*?)<\/script>/);
    if(!m) throw new Error("文件里没有课件数据");
    var deck=JSON.parse(m[1].replace(/\\u003c/g,"<"));
    applyDeck(deck);
    toast("已从云端加载："+(deck.title||id)+"（"+deck.slides.length+" 页）");
  }).catch(function(e){ toast("加载失败："+e.message); });
}

/* ---- 插入本地图片（转 dataURL，按比例缩放到最长边 400px） ---- */
function addImageFromFile(f){
  if(!f||!DECK||!DECK.slides||!DECK.slides.length) return;
  if(!/^image\//.test(f.type||"")&&!/\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(f.name||"")){
    toast("请选择图片文件（png/jpg/gif/webp 等）"); return;
  }
  var reader=new FileReader();
  reader.onload=function(){
    var dataUrl=reader.result;
    var img=new Image();
    img.onload=function(){
      var max=400, w=img.naturalWidth||300, h=img.naturalHeight||300;
      if(w>max||h>max){ var r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
      var si=idx, hi=DECK.slides[si].shapes.length;
      var shape={t:"i",src:dataUrl,x:120,y:120,w:w,h:h};
      DECK.slides[si].shapes.push(shape);
      renderSlideAt(si);
      selectAt(si,hi);
      pushUndo({undo:function(){ DECK.slides[si].shapes.splice(hi,1); renderSlideAt(si); clearSel(); },
                redo:function(){ DECK.slides[si].shapes.splice(hi,0,shape); renderSlideAt(si); selectAt(si,hi); }});
      toast("已插入图片（"+w+"×"+h+"），可拖动/缩放");
    };
    img.onerror=function(){ toast("图片加载失败"); };
    img.src=dataUrl;
  };
  reader.onerror=function(){ toast("读取图片失败"); };
  reader.readAsDataURL(f);
}

document.addEventListener("keydown",function(e){
  /* 编辑模式优先：Esc 退出编辑 / 清选择，Ctrl+Z/Y 撤销重做，Ctrl+D 复制，Delete 删除，屏蔽翻页与记断点 */
  if(EDIT&&DECK&&!(document.activeElement&&(document.activeElement.isContentEditable||/INPUT|TEXTAREA/.test(document.activeElement.tagName)))){
    var k0=e.key;
    if(k0==="Escape"){ e.preventDefault(); if(editingText){ commitTextEdit(); } else if(selSlide>=0){ clearSel(); } else { setEdit(false); } return; }
    if((e.ctrlKey||e.metaKey)&&k0==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
    if((e.ctrlKey||e.metaKey)&&k0==="y"){ e.preventDefault(); redo(); return; }
    if((e.ctrlKey||e.metaKey)&&k0==="d"){ e.preventDefault(); dupShape(); return; }
    if(k0==="Delete"||k0==="Backspace"){ e.preventDefault(); delShape(); return; }
    if(k0==="s"||k0==="S"||k0==="ArrowRight"||k0==="ArrowLeft"||k0==="ArrowDown"||k0==="ArrowUp"||
       k0===" "||k0==="PageDown"||k0==="PageUp"||k0==="Home"||k0==="End"){ e.preventDefault(); return; }
  }
  if(document.activeElement && (document.activeElement.isContentEditable ||
     /INPUT|TEXTAREA/.test(document.activeElement.tagName))) return;
  var k=e.key;
  if($("#ovp").classList.contains("show")){ if(k==="Escape"){ e.preventDefault(); closeOv(); } return; }
  if($("#note").classList.contains("show")){ if(k==="Escape"||k==="n"||k==="N"){ e.preventDefault(); closeNote(); } return; }
  if($("#clsOverlay").classList.contains("show")){ if(k==="Escape"){ e.preventDefault(); if(cur()) closeCls(); } return; }

  if(k==="ArrowRight"||k==="PageDown"||k===" "||k==="ArrowDown"){ e.preventDefault(); go(idx+1); }
  else if(k==="ArrowLeft"||k==="PageUp"||k==="ArrowUp"){ e.preventDefault(); go(idx-1); }
  else if(k==="Home"){ go(0); }
  else if(k==="End"){ go(TOTAL-1); }
  else if(k==="Escape"){ openOv(); }
  else if(k==="s"||k==="S"){ markHere(e.shiftKey); }
  else if(k==="n"||k==="N"){ openNote(); }
  else if(k==="e"||k==="E"){ if(DECK) setEdit(!EDIT); }
  else if(k==="h"||k==="H"){ document.body.classList.toggle("hide-ui"); setTimeout(fit,60); }
  else if(k==="c"||k==="C"){ openCls(); }
});

/* 滚轮 / 触摸 */
var acc=0,wt=null;
$("#viewport").addEventListener("wheel",function(e){
  if($("#ovp").classList.contains("show")) return;
  if(EDIT) return;   /* 编辑模式不滚轮翻页 */
  e.preventDefault(); acc+=e.deltaY;
  clearTimeout(wt);
  wt=setTimeout(function(){acc=0},180);
  if(acc>60){ go(idx+1); acc=0; } else if(acc<-60){ go(idx-1); acc=0; }
},{passive:false});
var tx0=null,ty0=null;
function tst(e){
  if(EDIT) return;   /* 编辑模式不触摸翻页 */
  tx0=e.touches[0].clientX; ty0=e.touches[0].clientY; }

function tmv(e){
  if(tx0===null) return;
  var dx=e.touches[0].clientX-tx0, dy=e.touches[0].clientY-ty0;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){ go(idx+(dx<0?1:-1)); tx0=null; }
}
function ten(){ tx0=null; }
$("#viewport").addEventListener("touchstart",tst,{passive:true});
$("#viewport").addEventListener("touchmove",tmv,{passive:true});
$("#viewport").addEventListener("touchend",ten);

window.addEventListener("resize",function(){ fit(); });
window.addEventListener("hashchange",function(){ var p=applyHash(); if(p){ save(); renderTopbar(); go(Math.max(0,p-1)); } });

/* ================= 启动 ================= */
/* 有内嵌工程数据（IR）→ 用运行时渲染器渲染；否则回退构建期注入的静态 slide HTML */
if(DECK&&DECK.slides){
  document.getElementById("deck").innerHTML=renderSlides(DECK).join("\n");
  TOTAL=DECK.slides.length;
  LID=DECK.id||LID; TITLE=DECK.title||TITLE;
  document.title=TITLE;
  var tt=document.querySelector(".tb-title"); if(tt) tt.textContent=TITLE;
  var sub=document.querySelector(".tb-sub"); if(sub) sub.textContent=LID;
  /* 多讲次：确保当前讲次在 lectures 中是同一个引用 */
  if(DECK.lectures&&DECK.lectures.length){
    DECK.lectures.forEach(function(l,i){ if(l.id===LID) DECK.lectures[i]=DECK; });
  }
}
/* 浏览器内导入 PPTX：导入器未注入（未构建）时隐藏按钮 */
if(window.PPTXImport&&window.PPTXImport.fromFile){ initPptxImport(); }
else{ var _pb=document.getElementById("pptxBtn"); if(_pb) _pb.style.display="none"; }
S=load();
buildDots();
/* 配置里新增了班级时，合并进来（已存在的按 id 更新 name） */
if(DEFAULT_CLASSES && DEFAULT_CLASSES.length){
  var have={}; S.classes.forEach(function(c){ have[c.id]=c; });
  var changed=false;
  DEFAULT_CLASSES.forEach(function(c,i){
    if(!c.id) return;
    if(have[c.id]){
      if(have[c.id].name!==c.name){ have[c.id].name=c.name; changed=true; }
    }else{
      S.classes.push({id:c.id,name:c.name||("班级"+(i+1))}); changed=true;
    }
  });
  if(changed) save();
}
var jumped=applyHash();
if(!cur()){
  if(S.classes.length){ S.current=S.classes[0].id; }
  openCls();                      /* 没选过班 / 一个班都没有 → 弹面板 */
}
save(); renderCls(); renderTopbar();
fit(); go(jumped?Math.max(0,jumped-1):0,true);
if(!jumped) autoJump(false);
/* M3：草稿恢复检查默认关闭（需要时取消注释） */
/* setTimeout(checkDraftOnLoad,1500); */
</script>
